<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
    Logotipo de InternetBankingApp: un escudo (el dinero está protegido) con tres barras
    ascendentes (el patrimonio crece). La figura completa cabe dentro del círculo seguro que
    recortan los lanzadores de Android, para que no se corte en ninguna plataforma.
-->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="escudo" x1="112" y1="92" x2="344" y2="372" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FFFFFF" />
            <stop offset="1" stop-color="#E3F8EF" />
        </linearGradient>
    </defs>

    <!-- Cuerpo del escudo -->
    <path d="M228 92 L344 136 L344 240 C344 306 297 350 228 372 C159 350 112 306 112 240 L112 136 Z"
          fill="url(#escudo)" />

    <!-- Línea base del gráfico -->
    <rect x="156" y="292" width="144" height="7" rx="3.5" fill="#B7E4D0" />

    <!-- Barras ascendentes -->
    <rect x="158" y="230" width="34" height="54" rx="9" fill="#6EE7B7" />
    <rect x="211" y="196" width="34" height="88" rx="9" fill="#10B981" />
    <rect x="264" y="162" width="34" height="122" rx="9" fill="#047857" />
</svg>
