    <defs>
        <linearGradient id="fondo" x1="0" y1="0" x2="456" y2="456" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#12496B" />
            <stop offset="0.55" stop-color="#0B3550" />
            <stop offset="1" stop-color="#06243B" />
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="456" height="456" fill="url(#fondo)" />
</svg>
